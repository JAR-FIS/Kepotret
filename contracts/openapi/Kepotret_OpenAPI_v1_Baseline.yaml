          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignAssetUploadAuthorizationEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Owner / can_setup
      x-kepotret-rules:
      - V1 accepts COVER assets only, with image/jpeg, image/png, or image/webp content types and 0 < size_bytes <= 5000000.
      - Current Owner/can_setup authorization and current album state are re-evaluated before issuing a short-lived upload authorization.
      - The server creates or records the DesignAsset before issuing authorization. Upload authorization returns its asset_id; the browser must not derive it from object_key, URL, or filename.
