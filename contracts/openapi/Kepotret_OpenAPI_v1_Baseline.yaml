        can_download:
          type: boolean
      required: [photo_id, created_at, photographer_display_name, media, can_download]
    AlbumPackageOptions:
      type: object
      additionalProperties: false
      description: Server-authoritative package eligibility and checkout window for one album.
      properties:
        album_id:
