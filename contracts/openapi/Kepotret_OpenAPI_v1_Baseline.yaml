components:
  securitySchemes:
    UserCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_session
    InvitationContinuationCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_invitation_continuation
      description: Short-lived Secure HttpOnly SameSite=Lax invitation continuation; not an authenticated session or membership.
    GuestCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_guest
    AdminCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_admin
    MidtransWebhook:
      type: http
      scheme: bearer
      description: Logical placeholder for provider-specific verified Midtrans webhook authentication. Browser cookies/CSRF
        are not used; implementation must verify the actual Midtrans contract before accepting business state.
    GoogleServiceOIDC:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC service identity
    MediaGatewayHMAC:
      type: apiKey
      in: header
      name: X-Kepotret-Signature
      description: HMAC service authentication is accompanied by service identity and timestamp/freshness headers; signature
        covers method, path, timestamp and body digest.
    AdminMfaChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_admin_mfa_challenge
      description: Short-lived pre-session MFA challenge cookie issued after valid admin password; not an AdminSession.
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        details: {}
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PaginationMeta:
      type: object
      required:
      - has_more
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    AlbumReadiness:
      type: string
      enum:
      - DRAFT
      - PAYMENT_PENDING
      - READY
      description: Public readiness dimension; capture/reveal state remain separate.
    AlbumActorRelationship:
      type: string
      enum: [OWNER, COLLABORATOR]
      description: Current server-derived relationship between the authenticated User and one album.
    AlbumActorAccess:
      type: object
      additionalProperties: false
      description: Current relationship and collaborator permission snapshot. Server recalculates from current membership on each authorized request; rendered access never freezes authorization. OWNER has null collaborator_permissions and permission_version. COLLABORATOR requires both values; Owner rights are not represented as collaborator flags.
      properties:
        relationship:
          $ref: '#/components/schemas/AlbumActorRelationship'
        collaborator_permissions:
          oneOf:
          - $ref: '#/components/schemas/CollaboratorPermissions'
          - type: 'null'
        permission_version:
          type: [integer, 'null']
          minimum: 0
      required: [relationship, collaborator_permissions, permission_version]
    PaymentPublicStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILURE
      - EXPIRED
      description: Normalized status exposed to ordinary Host payment surfaces.
    ExportStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - READY
      - FAILED
      - INVALIDATED
      - EXPIRED
    ActorCapability:
      type: string
      enum:
      - can_setup
      - can_moderate
      - can_export_zip
    ModerationStatus:
      type: string
      enum:
      - PENDING
      - PUBLISHED
      - HIDDEN
    CaptureState:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    RevealState:
      type: string
      enum:
      - HIDDEN
      - REVEALED
    PaymentTransactionStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - SUCCESS
      - FAILURE
      - EXPIRED
      description: Internal/local payment orchestration status. PROCESSING is not exposed through PaymentTransaction.
    PaymentType:
      type: string
      enum:
      - INITIAL_PURCHASE
      - UPGRADE
    ExportSelectionPhoto:
      type: object
      additionalProperties: false
      description: Read-only identity projection for currently eligible selected-export rows. It grants no interactive media access, moderation, share, or individual download action. Selected export capability and can_export_zip do not expand any other capability; allow_selected is server-authoritative.
      properties:
        photo_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        photographer_display_name:
          type: string
          minLength: 1
          maxLength: 50
      required: [photo_id, created_at, photographer_display_name]
    RecoveryPhoto:
      type: object
      additionalProperties: false
      description: Owner-only view/download projection for logically available media during an active recovery grant.
      properties:
        photo_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        photographer_display_name:
          type: string
          minLength: 1
          maxLength: 50
        media:
