    post:
      tags:
      - Album
      summary: Final Host confirmation; persist confirmed setup snapshot; FREE→READY or PAID→PAYMENT_PENDING.
      operationId: post_api_v1_albums_album_id_confirm_setup
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: Idempotency + CSRF
      x-kepotret-auth: Owner
