  /api/v1/albums/{album_id}/photos/{photo_id}/download:
    get:
      tags:
      - Moderation
      summary: Owner individual download through Media Gateway; allowed in normal access and explicit D+30..D+37 recovery
        while media exists.
      operationId: get_api_v1_albums_album_id_photos_photo_id_download
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Authorized short-lived Media Gateway delivery descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringUrlEnvelope'
      x-kepotret-auth: Owner only
      x-kepotret-protection: '-'
      x-kepotret-rules:
      - Allowed during normal access and explicit Owner recovery D+30..D+37 while media exists.
      - WO/EO can_moderate and can_export_zip do not grant individual photo download.
      - Delivery uses current-authorization Media Gateway; D+37 remains fixed.
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: photo_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
components:
  securitySchemes:
    UserCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_session
    GuestCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_guest
    AdminCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_admin
    MidtransWebhook:
      type: http
      scheme: bearer
      description: Logical placeholder for provider-specific verified Midtrans webhook authentication. Browser cookies/CSRF
        are not used; implementation must verify the actual Midtrans contract before accepting business state.
    GoogleServiceOIDC:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC service identity
    MediaGatewayHMAC:
      type: apiKey
      in: header
      name: X-Kepotret-Signature
      description: HMAC service authentication is accompanied by service identity and timestamp/freshness headers; signature
        covers method, path, timestamp and body digest.
    AdminMfaChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-kepotret_admin_mfa_challenge
      description: Short-lived pre-session MFA challenge cookie issued after valid admin password; not an AdminSession.
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        details: {}
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    PaginationMeta:
      type: object
      required:
      - has_more
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    AlbumReadiness:
      type: string
      enum:
      - DRAFT
      - PAYMENT_PENDING
      - READY
      description: Public readiness dimension; capture/reveal state remain separate.
    PaymentPublicStatus:
      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILURE
      - EXPIRED
    ExportStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - READY
      - FAILED
      - INVALIDATED
      - EXPIRED
    ActorCapability:
      type: string
      enum:
      - can_setup
      - can_moderate
      - can_export_zip
    ModerationStatus:
      type: string
      enum:
      - PENDING
      - PUBLISHED
      - HIDDEN
    CaptureState:
      type: string
      enum:
      - NOT_STARTED
      - OPEN
      - CLOSED
    RevealState:
      type: string
      enum:
      - HIDDEN
      - REVEALED
    PaymentTransactionStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - SUCCESS
      - FAILURE
      - EXPIRED
    ScheduledJobStatus:
