openapi: 3.1.0
info:
  title: Kepotret API
  version: 1.0.0
  description: Final Checkpoint 7 synchronized typed V1 contract aligned to PRD v0.5, BPMN/Use Case v0.5, DFD/ERD v0.5, Permission
    v0.2, Architecture v0.3, Technology v0.2, Physical DB v0.3, and API Contract v0.1. Request/response DTOs, required fields,
    enum/state semantics, success status codes, and security declarations are implementation constraints and the source for
    generated TypeScript client/types.
servers:
- url: https://api.kepotret.id
  description: Production
- url: https://api-staging.kepotret.id
  description: Staging
- url: http://localhost:8080
  description: Local
tags:
- name: Auth
- name: Security
- name: Admin Auth
- name: Guest Entry
- name: Album
- name: Design
- name: Collaboration
- name: Capture
- name: Guest Gallery
- name: Moderation
- name: Catalog
- name: Payment
- name: Export
- name: Lifecycle
- name: AI
- name: Admin
- name: Admin Sensitive
- name: Admin Hold
- name: Internal
paths:
  /api/v1/auth/google/start:
    get:
      tags:
      - Auth
      summary: Start Google OIDC + PKCE; safe return_to allowlist.
      operationId: get_api_v1_auth_google_start
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Public
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/auth/google/callback:
    get:
      tags:
      - Auth
      summary: Verify code/state/nonce/PKCE; create User/AuthSession; redirect.
      operationId: get_api_v1_auth_google_callback
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '302':
          description: Redirect to allowlisted Kepotret frontend destination after successful callback.
      x-kepotret-protection: '-'
      x-kepotret-auth: Google callback
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Return current ordinary user; no global HOST role.
      operationId: get_api_v1_auth_me
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke server session and clear cookie.
      operationId: post_api_v1_auth_logout
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/security/csrf:
    get:
      tags:
      - Security
      summary: Issue session-bound CSRF token.
      operationId: get_api_v1_security_csrf
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Browser session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/admin/auth/login:
    post:
      tags:
      - Admin Auth
      summary: Verify admin email/password; issue short MFA challenge only.
      operationId: post_api_v1_admin_auth_login
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF/Origin
      x-kepotret-auth: Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/admin/auth/mfa/verify:
    post:
      tags:
      - Admin Auth
      summary: Verify TOTP; create AdminSession.
      operationId: post_api_v1_admin_auth_mfa_verify
      security:
      - AdminMfaChallengeCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
      x-kepotret-protection: CSRF/Origin
      x-kepotret-auth: MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMfaVerifyRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/admin/auth/me:
    get:
      tags:
      - Admin Auth
      summary: Return current admin session state.
      operationId: get_api_v1_admin_auth_me
      security:
      - AdminCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Admin session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Admin Auth
      summary: Revoke AdminSession and clear cookie.
      operationId: post_api_v1_admin_auth_logout
      security:
      - AdminCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Admin session
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/guest/access/resolve:
    post:
      tags:
      - Guest Entry
      summary: Resolve guest link to safe album preview; never log secret.
      operationId: post_api_v1_guest_access_resolve
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumSummaryEnvelope'
      x-kepotret-protection: Origin/rate
      x-kepotret-auth: Link secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestAccessResolveRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/guest/sessions:
    post:
      tags:
      - Guest Entry
      summary: Create GuestSession + GuestCredential; optional PIN.
      operationId: post_api_v1_guest_sessions
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionEnvelope'
      x-kepotret-protection: Idempotency + rate
      x-kepotret-auth: Link secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionCreateRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/guest/me:
    get:
      tags:
      - Guest Entry
      summary: Return guest/session album capabilities.
      operationId: get_api_v1_guest_me
      security:
      - GuestCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Guest credential
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/guest/logout:
    post:
      tags:
      - Guest Entry
      summary: Revoke current GuestCredential; retain GuestSession.
      operationId: post_api_v1_guest_logout
      security:
      - GuestCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Guest credential
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/albums:
    post:
      tags:
      - Album
      summary: Create draft album + FREE30 entitlement/quota.
      operationId: post_api_v1_albums
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: Idempotency + CSRF
      x-kepotret-auth: User session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
    get:
      tags:
      - Album
      summary: Cursor list of owned/collaborated albums.
      operationId: get_api_v1_albums
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumListEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/albums/{album_id}:
    get:
      tags:
      - Album
      summary: Album detail after relationship authorization.
      operationId: get_api_v1_albums_album_id
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
    patch:
      tags:
      - Album
      summary: Edit draft basics; timezone locked after first confirmation.
      operationId: patch_api_v1_albums_album_id
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: CSRF + revision
      x-kepotret-auth: Owner / can_setup in draft
      x-kepotret-rules:
      - capture_start/capture_end are RFC3339 instants; clients present and convert event wall time using AlbumDetail.timezone.
      - Initial start is not in the past and is within three calendar months with month-end clamping.
      - Capture duration is at most 120 hours; end must be after start; reveal delay is exactly 1, 3, 5, or 7.
      - reveal_at and payment_cutoff_at are derived by the server; payment cutoff is capture_end minus 120 minutes.
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumPatchRequest'
  /api/v1/albums/{album_id}/schedule:
    get:
      tags:
      - Album
      summary: Read the current album schedule in its persisted event timezone.
      operationId: get_api_v1_albums_album_id_schedule
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Owner / can_setup
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
    put:
      tags:
      - Album
      summary: Set initial schedule; server derives reveal/payment deadlines.
      operationId: put_api_v1_albums_album_id_schedule
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleEnvelope'
      x-kepotret-protection: CSRF + revision
      x-kepotret-auth: Owner / can_setup in draft
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleWriteRequest'
  /api/v1/albums/{album_id}/settings:
    patch:
      tags:
      - Album
      summary: Update gallery/moderation/guest settings.
      operationId: patch_api_v1_albums_album_id_settings
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF + revision
      x-kepotret-auth: Owner / can_setup as allowed
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumSettingsPatchRequest'
  /api/v1/albums/{album_id}/access/pin:
    put:
      tags:
      - Album
      summary: Set/replace Argon2id PIN.
      operationId: put_api_v1_albums_album_id_access_pin
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Owner; can_setup only while draft
      parameters:
      - name: album_id
        in: path
