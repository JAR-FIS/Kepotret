        for FREE), setup_confirmed_at.
      - Validate expected_setup_revision and authoritative completeness review before confirmation.
      - Snapshot the persisted draft selected_package_version_id; the browser does not resend commercial values or package ID.
      - First confirmation freezes first_confirmed_capture_start/timezone and fixed reschedule_cutoff_at.
      - FREE becomes READY; paid choice becomes PAYMENT_PENDING until verified payment.
