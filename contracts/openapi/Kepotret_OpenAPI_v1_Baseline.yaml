openapi: 3.1.0
info:
  title: Kepotret API
  version: 1.0.0
  description: Final Checkpoint 7 synchronized typed V1 contract aligned to PRD v0.5, BPMN/Use Case v0.5, DFD/ERD v0.5, Permission
    v0.2, Architecture v0.3, Technology v0.2, Physical DB v0.3, and API Contract v0.1. Request/response DTOs, required fields,
    enum/state semantics, success status codes, and security declarations are implementation constraints and the source for
    generated TypeScript client/types.
servers:
- url: https://api.kepotret.id
  description: Production
- url: https://api-staging.kepotret.id
  description: Staging
- url: http://localhost:8080
  description: Local
tags:
- name: Auth
- name: Security
- name: Admin Auth
- name: Guest Entry
- name: Album
- name: Design
- name: Collaboration
- name: Capture
- name: Guest Gallery
- name: Moderation
- name: Catalog
- name: Payment
- name: Export
- name: Lifecycle
- name: AI
- name: Admin
- name: Admin Sensitive
- name: Admin Hold
- name: Internal
paths:
  /api/v1/auth/google/start:
    get:
      tags:
      - Auth
      summary: Start Google OIDC + PKCE; safe return_to allowlist.
      operationId: get_api_v1_auth_google_start
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Public
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: return_to
        in: query
        required: false
        description: Allowlisted frontend-relative return path. Never include invitation secrets or OAuth credentials.
        schema:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^/(?!/)[^#]*$'
  /api/v1/auth/google/callback:
    get:
      tags:
      - Auth
      summary: Verify code/state/nonce/PKCE; create User/AuthSession; redirect.
      operationId: get_api_v1_auth_google_callback
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '302':
          description: Redirect to allowlisted Kepotret frontend destination after successful callback.
      x-kepotret-protection: '-'
      x-kepotret-auth: Google callback
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Return current ordinary user; no global HOST role.
      operationId: get_api_v1_auth_me
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke server session and clear cookie.
      operationId: post_api_v1_auth_logout
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/security/csrf:
    get:
      tags:
      - Security
      summary: Issue a session-bound CSRF token for user or guest cookie sessions.
      operationId: get_api_v1_security_csrf
      security:
      - UserCookie: []
      - GuestCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User or guest session
      x-kepotret-rules:
      - Bind the token to the authenticated UserCookie or GuestCookie session that requested it.
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/admin/auth/login:
    post:
      tags:
      - Admin Auth
      summary: Verify admin email/password; issue short MFA challenge only.
      operationId: post_api_v1_admin_auth_login
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF/Origin
      x-kepotret-auth: Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AdminCsrfToken'
  /api/v1/admin/auth/mfa/verify:
    post:
      tags:
      - Admin Auth
      summary: Verify TOTP; create AdminSession.
      operationId: post_api_v1_admin_auth_mfa_verify
      security:
      - AdminMfaChallengeCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
      x-kepotret-protection: CSRF/Origin
      x-kepotret-auth: MFA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMfaVerifyRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AdminCsrfToken'
  /api/v1/admin/auth/me:
    get:
      tags:
      - Admin Auth
      summary: Return current admin session state.
      operationId: get_api_v1_admin_auth_me
      security:
      - AdminCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Admin session
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - Admin Auth
      summary: Revoke AdminSession and clear cookie.
      operationId: post_api_v1_admin_auth_logout
      security:
      - AdminCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Admin session
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AdminCsrfToken'
  /api/v1/admin/security/csrf:
    get:
      tags:
      - Admin Auth
      summary: Issue a browser-visible Admin CSRF token bound to the current admin auth lifecycle context.
      operationId: get_api_v1_admin_security_csrf
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Admin CSRF token for login, MFA, or an established AdminSession.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfEnvelope'
      x-kepotret-protection: Strict Origin
      x-kepotret-auth: Admin pre-auth, MFA challenge, or Admin session
      x-kepotret-rules:
      - Bind the token to the Admin pre-auth, MFA challenge, or AdminSession context; never use ordinary User/Guest CSRF context.
      - The browser may hold the token in memory only; never log or persist it.
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/admin/auth/step-up:
    post:
      tags:
      - Admin Auth
      summary: Verify TOTP for short-lived step-up bound to the current AdminSession.
      operationId: post_api_v1_admin_auth_step_up
      security:
      - AdminCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Current step-up verification window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStepUpEnvelope'
      x-kepotret-protection: Admin CSRF + Origin
      x-kepotret-auth: Admin session
      x-kepotret-rules:
      - Bind step-up to this AdminSession and invalidate it when that session ends or is revoked.
      - The server determines expiry; do not expose a fixed duration in frontend behavior.
      - Never log or persist the TOTP code.
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AdminCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStepUpRequest'
  /api/v1/guest/access/resolve:
    post:
      tags:
      - Guest Entry
      summary: Resolve guest link to a guest-safe event preview; never log secret.
      operationId: post_api_v1_guest_access_resolve
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestAccessPreviewEnvelope'
      x-kepotret-protection: Origin/rate
      x-kepotret-auth: Link secret
      x-kepotret-rules:
      - Return only guest-safe event/capture fields; never include PIN hashes, owner/admin fields, package/payment data, revisions, or secret material.
      - consent_version is the current server-owned consent version required to create a GuestSession.
      - Do not log or persist access_secret; accept it only in the request body over HTTPS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestAccessResolveRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/guest/sessions:
    post:
      tags:
      - Guest Entry
      summary: Create GuestSession + GuestCredential after consent; optional PIN.
      operationId: post_api_v1_guest_sessions
      security: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionEnvelope'
      x-kepotret-protection: Idempotency + rate
      x-kepotret-auth: Link secret
      x-kepotret-rules:
      - Require the same valid link_id/access_secret and current accepted_consent_version returned by guest access resolve.
      - Trim display_name and accept 1-50 Unicode characters; duplicate names are allowed and the saved name is immutable.
      - Require pin only when the resolved event requires it; never treat display_name as authentication or recovery.
      - Idempotency-Key must be UUIDv7 and reused for retries of the same logical join request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionCreateRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/guest/me:
    get:
      tags:
      - Guest Entry
      summary: Return the authenticated guest identity and safe event context for phase restoration.
      operationId: get_api_v1_guest_me
      security:
      - GuestCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestContextEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: Guest credential
      x-kepotret-rules:
      - 410 Gone represents normal guest access closure at D+30; guest recovery and capture are not permitted.
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /api/v1/guest/logout:
    post:
      tags:
      - Guest Entry
      summary: Revoke current GuestCredential; retain GuestSession.
      operationId: post_api_v1_guest_logout
      security:
      - GuestCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyDataEnvelope'
      x-kepotret-protection: CSRF
      x-kepotret-auth: Guest credential
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
  /api/v1/albums:
    post:
      tags:
      - Album
      summary: Create draft album + FREE30 entitlement/quota.
      operationId: post_api_v1_albums
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: Idempotency + CSRF
      x-kepotret-auth: User session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCreateRequest'
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
    get:
      tags:
      - Album
      summary: Cursor list of owned/collaborated albums.
      operationId: get_api_v1_albums
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumListEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: relationship
        in: query
        required: false
        description: Server-side album relationship filter for the current User. Omit to list both relationships.
        schema:
          $ref: '#/components/schemas/AlbumActorRelationship'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /api/v1/albums/{album_id}:
    get:
      tags:
      - Album
      summary: Album detail after relationship authorization.
      operationId: get_api_v1_albums_album_id
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: '-'
      x-kepotret-auth: User session
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
    patch:
      tags:
      - Album
      summary: Edit draft basics; timezone locked after first confirmation.
      operationId: patch_api_v1_albums_album_id
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumEnvelope'
      x-kepotret-protection: CSRF + revision
      x-kepotret-auth: Owner / can_setup in draft
      x-kepotret-rules:
      - capture_start/capture_end are RFC3339 instants; clients present and convert event wall time using AlbumDetail.timezone.
      - Initial start is not in the past and is within three calendar months with month-end clamping.
      - Capture duration is at most 120 hours; end must be after start; reveal delay is exactly 1, 3, 5, or 7.
      - reveal_at and payment_cutoff_at are derived by the server; payment cutoff is capture_end minus 120 minutes.
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumPatchRequest'
  /api/v1/albums/{album_id}/schedule:
    get:
      tags:
      - Album
      summary: Read the current album schedule in its persisted event timezone.
      operationId: get_api_v1_albums_album_id_schedule
      security:
      - UserCookie: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
